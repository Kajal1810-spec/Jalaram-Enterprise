<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Reset Password</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site-header"><div class="container header-inner"><div class="brand"><img src="/assets/logo.svg" class="logo"/><div><h1>Jalaram</h1></div></div></div></header>
<main class="container main">
<div class="card"><h3>Reset Password</h3>
<label>New Password<input id="password" type="password"></label>
<button id="reset" class="btn primary">Reset Password</button>
</div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('token');
document.getElementById('reset').onclick = async ()=>{
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/reset', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ token, password })});
  const j = await res.json();
  if(j.ok) { alert('Password reset. Please login.'); location.href='/pages/login.html'; } else alert('Error: '+(j.error||'unknown'));
};
</script>
</body></html>
