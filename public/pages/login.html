<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Login</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site-header"><div class="container header-inner"><div class="brand"><img src="/assets/logo.svg" class="logo"/><div><h1>Jalaram</h1></div></div></div></header>
<main class="container main"><div class="card"><h3>Login</h3><label>Email<input id="email"></label><label>Password<input id="password" type="password"></label><button id="login" class="btn primary">Login</button><p class="small">Don't have account? <a href="/pages/register.html">Register</a></p></div></main>
<script>
document.getElementById('login').onclick = async ()=>{
  const email = document.getElementById('email').value, password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({email,password})});
  const j = await res.json();
  if(j.token){ localStorage.setItem('je_token', j.token); alert('Logged in'); location.href='/'; } else alert('Login failed: ' + (j.error||'Unknown'));
};
</script></body></html>
