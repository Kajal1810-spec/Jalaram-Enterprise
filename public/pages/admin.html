<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="site-header"><div class="container header-inner"><div class="brand"><img src="/assets/logo.svg" class="logo"/><div><h1>Admin Panel</h1></div></div></div></header>
<main class="container main">
<div class="card"><h3>Admin Actions</h3>
<label>Admin Key<input id="admin-key" placeholder="admin key"></label>
<button id="login" class="btn primary">Use Key</button>
</div>

<div id="manage" style="display:none">
  <div class="card"><h3>Add Product</h3>
    <form id="add-form" enctype="multipart/form-data">
      <label>Title<input name="title" required></label>
      <label>Price<input name="price" type="number" required></label>
      <label>Tag<input name="tag" required></label>
      <label>Description<textarea name="desc"></textarea></label>
      <label>Image<input name="image" type="file" accept="image/*"></label>
      <div style="display:flex;gap:8px"><button class="btn primary" type="submit">Add</button><button id="refresh" class="btn ghost" type="button">Refresh</button></div>
    </form>
  </div>

  <div class="card"><h3>Products</h3><div id="prod-list"></div></div>
  <div class="card"><h3>Orders</h3><div id="orders"></div></div>
</div>
</main>
<script src="/js/admin.js"></script></body></html>
